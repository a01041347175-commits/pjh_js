<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CONTAINER</title>
    <script>
        // 컨테이너(Container) 자료형: 
        // 파이썬 : List, Tuple, Dictionary
        // 자바스크립트 : Array(배열), Map(맵), Object

        // 배열
        // 선언방법
        var nums = [1, 2, 3, 4, 5];

        // 조회 방법
        console.log(nums[3]);  // 4

        // 배열 nums에 마직 인덱스에 해당하는 데이터 조회
        // console.log(nums[4]);  // 5
        console.log(nums[nums.length-1]);  //5
        console.log(nums[0]);  // 1

        // 배열의 크기(길이, length) 조회
        console.log(`nums.length: ${nums.length}`);  // 5

        //배열의 전체 데이터 조회
        /* 
            python
            nums = [1, 2, 3]
            for i in range(len(nums)):
                print(i)
        */
        for(var i = 0; i < nums.length; i++) {
            console.log(nums[i]);
        }

        // forEach
        nums.forEach((num) => {
            console.log(num);
        });

        /*
        var fun1 = () => {...}
        */

        nums.forEach((num, idx) => {
            console.log(num);
            console.log(idx);
        });

        var users = [
            {name: '길동', age: 20},
            {name: '찬호', age: 30},
            {name: '세리', age: 40}
        ]
        for(var i = 0; i < users.length; i++) {
            var user = users[i];
            console.log(`name: ${user.name}, age: ${user.age}`);
        }

        users.forEach((user) => { // 데이터가 하나면 () 생략가능
            console.log(`name: ${user.name}, age: ${user.age}`);
        });

        // 맵(Map) == Object와 거의 비슷.
        // 선언 방법
        var myInfo = new Map(); // key: value
        // 데이터 추가
        myInfo.set('name', '홍길동');
        myInfo.set('age', 20);

        // 데이터 조회
        console.log(myInfo.get('name'));
        console.log(myInfo.get('age'));

        // 데이터 삭제
        myInfo.delete('age');
        console.log(myInfo.get('age'));

        // 데이터 수정
        myInfo.set('name', '홍길자');
        console.log(myInfo.get('name'));

        /*
        CRUD
        Create(생성)
        Read(조회)
        Update(수정)
        Delete(삭제)
        */

        // Object, Array, Map

    </script>
</head>
<body>
    
</body>
</html>
